<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jim's Page — a new home on the web. More coming soon.">
  <meta name="theme-color" content="#101827">
  <title>Jim's Page | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: #101827; color: #f4f7fb; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(100%, 52rem); padding: clamp(2rem, 7vw, 5rem) 0; }
    .brand { margin: 0 0 4rem; color: #93c5fd; font-size: 1rem; font-weight: 650; letter-spacing: .06em; }
    h1 { margin: 0 0 1.5rem; max-width: 12ch; font-size: clamp(3rem, 9vw, 6rem); line-height: 1.04; letter-spacing: -.05em; }
    .intro { max-width: 35rem; margin: 0; color: #bdc9db; font-size: clamp(1.1rem, 3vw, 1.4rem); line-height: 1.7; }
    footer { margin-top: 4rem; padding-top: 1.5rem; border-top: 1px solid #334155; color: #aab8cb; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <p class="brand">JIMZPAGE.COM</p>
    <h1>Welcome to Jim's Page.</h1>
    <p class="intro">A new home on the web. This is just the beginning—more coming soon.</p>
    <footer>Jim's Page &middot; Under construction</footer>
  </main>
</body>
</html>
